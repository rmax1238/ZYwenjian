    exclude-type: "Direct"
    url: "https://cp.cloudflare.com/generate_204"
    interval: 300
    expected-status: 204
    tolerance: 50
    lazy: true

  # ---------- 其他地区 ----------
  #
  # 【重要】使用 (?!) 负向先行断言排除已分地区节点。
  # 依赖 mihomo 的 regexp2 引擎（.NET 风格，支持断言）；
  # 原版 Clash / 使用 Go RE2 的客户端会编译失败。
  - name: "🌍 其他地区"
    type: select
    include-all-proxies: true
    filter: '(?i)^(?!.*(?:🇭🇰|🇯🇵|🇸🇬|🇺🇸|🇹🇼|🇰🇷|香港|日本|新加坡|美国|台湾|韩国|\bHK\b|\bHKG\b|\bJP\b|\bJPN\b|\bSG\b|\bSGP\b|\bUS\b|\bUSA\b|\bTW\b|\bTWN\b|\bKR\b|\bKOR\b|Hong[ -]?Kong|Japan|Tokyo|Osaka|Singapore|United[ -]?States|America|Los[ -]?Angeles|New[ -]?York|San[ -]?Francisco|Taiwan|Taipei|Korea|Seoul)).*'
    exclude-filter: "(?i)官网|流量|剩余|到期|过期|套餐|订阅|重置|邀请|客服|返利|购买|续费|试用|测速|群组|机场|traffic|expire|expired|subscription|reset|official|website"
    exclude-type: "Direct"

  # ---------- 广告拦截 ----------
  - name: "🛑 广告拦截"
    type: select
    proxies:
      - REJECT
      - DIRECT

  - name: "🚀 兜底代理"
    type: select
    proxies:
      - "🎯 节点选择"
      - "DIRECT"
    # 仅 MATCH 兜底；想改全局出口请去「🎯 节点选择」

# ---------------- 规则 ----------------

rules:

  # 0. 【可选，默认关闭】全局封锁 QUIC（UDP/443）
  #    背景：不少机场对 UDP 443 的转发质量明显差于 TCP，
  #          表现是 YouTube / Google 首屏卡住、视频缓冲。
  #          封掉 QUIC 后浏览器会自动回落到 HTTP/2 over TCP，通常更稳。
  #    代价：所有 HTTP/3 站点失去 QUIC 加速；依赖 UDP 443 的应用受影响；
  #          嗅探里的 QUIC 规则也就不再起作用。
  #    需要时把下面这行的注释去掉，位置保持在最前。
  # - "AND,((DST-PORT,443),(NETWORK,UDP)),REJECT"

  # 1. 私有地址 / 局域网
  - "GEOSITE,private,DIRECT"
  - "GEOIP,private,DIRECT,no-resolve"
  - "IP-CIDR,127.0.0.0/8,DIRECT,no-resolve"
  - "IP-CIDR,224.0.0.0/4,DIRECT,no-resolve"
  - "IP-CIDR,255.255.255.255/32,DIRECT,no-resolve"

  # 2. 广告
  - "RULE-SET,ads,🛑 广告拦截"

  # 3. 国内 AI 直连（必须在 AI 规则之前）
  - "RULE-SET,ai-cn,DIRECT"

  # 4. 游戏平台
  #    顺序是刻意设计的：国服平台与 Steam 国内 CDN 先直连（快、省流量），
  #    再走客户端进程识别（抓游戏内没有域名的连接），最后域名集兜底。
  - "RULE-SET,game-cn,DIRECT"
  - "RULE-SET,games,🎮 游戏平台"
  - "GEOSITE,category-games,🎮 游戏平台"
  - "GEOSITE,discord,🎮 游戏平台"

  # 5. 国区服务直连（必须放在对应服务组之前）
  - "GEOSITE,apple-cn,DIRECT"
  - "GEOSITE,microsoft@cn,DIRECT"
  - "DOMAIN-SUFFIX,windowsupdate.com,DIRECT"
  - "DOMAIN-SUFFIX,download.windowsupdate.com,DIRECT"
  - "DOMAIN-SUFFIX,delivery.mp.microsoft.com,DIRECT"
  - "DOMAIN-SUFFIX,update.microsoft.com,DIRECT"

  # 6. AI 分流
  #    顺序：先各服务的辅助链路，再按服务拆组，最后用 AI 总集兜底。
  - "RULE-SET,ai-openai,🧠 ChatGPT"
  - "GEOSITE,openai,🧠 ChatGPT"
  - "GEOSITE,anthropic,🎭 Claude"
  - "GEOSITE,google-gemini,✨ Gemini"
  - "GEOSITE,google-deepmind,✨ Gemini"
  - "RULE-SET,ai-copilot,🧩 Copilot"
  - "RULE-SET,ai-extra,🤖 AI服务"
  - "RULE-SET,ai,🤖 AI服务"
  # Anthropic 自有 IP 段，防止域名未命中时漏走
  - "IP-CIDR,160.79.104.0/21,🎭 Claude,no-resolve"

  # 7. YouTube
  - "RULE-SET,youtube,📺 油管专用"

  # 8. 币圈
  - "RULE-SET,crypto,💰 币圈专用"

  # 9. 流媒体
  - "RULE-SET,disney,🎬 流媒体"
  - "GEOSITE,netflix,🎬 流媒体"
  - "GEOSITE,spotify,🎬 流媒体"
  - "GEOSITE,tiktok,🎬 流媒体"

  # 10. Apple
  - "RULE-SET,apple,🍎 苹果服务"

  # 11. Google
  - "RULE-SET,google,🔍 谷歌服务"

  # 12. Telegram
  - "GEOSITE,telegram,💬 电报专用"

  # 13. Microsoft
  - "GEOSITE,microsoft,Ⓜ️ 微软服务"

  # 14. 中国大陆
  - "GEOSITE,CN,DIRECT"
  - "GEOIP,CN,DIRECT,no-resolve"

  # 15. 兜底
  - "MATCH,🚀 兜底代理"


# ============================================================
# 规则源清单与甄别结论
# ------------------------------------------------------------
# 【采用】
#   MetaCubeX/meta-rules-dat
#     geo/geosite/category-ai-!cn     AI 总集（约 180 条），每日更新
#     geo/geosite/openai              ChatGPT 主域名
#     geo/geosite/anthropic           Claude 主域名
#     geo/geosite/google-gemini       Gemini / AI Studio
#     geo/geosite/google-deepmind     DeepMind
#     来源：Perfect-Rules 的 ai.yaml 已包装 category-ai-!cn，
#           其余分类直接以 GEOSITE 引用，无需额外 provider
#
#   MetaCubeX/meta-rules-dat（游戏部分）
#     geo/geosite/category-games      海外游戏平台总集（约 1123 条），
#                                     含 Steam / Epic / 战网 / Riot / Ubisoft /
#                                     EA / GOG / Rockstar / 任天堂 / PS / Xbox
#     geo/geosite/discord             category-games 未收录，单独补一条
#     已验证 category-games 与 microsoft / apple / google / netflix /
#     spotify / tiktok / telegram 分类零重叠，不会抢走其他分组的流量
#
#   国服平台与 Steam 国内 CDN 没有整段引用 category-games@cn，
#   而是人工整理成 game-cn 内联集。原因：该分类含 steamserver.net
#   （Steam 连接服务器，国内可达性不确定），整段直连有登录失败风险。
#
# 【部分采用】
#   blackmatrix7/ios_rule_script
#     rule/Clash/OpenAI|Claude|Gemini|Copilot
#     采用原因：这四套的「辅助链路」（arkoselabs 验证码、statsig 功能开关、
#               livekit 语音、azurefd/azureedge 文件上传）比 geosite 完整。
#     未直接引用的原因：这四套同时塞进了大量共享基础设施域名 ——
#               auth0.com / stripe.com / sentry.io / algolia.net /
#               launchdarkly.com / segment.io / intercom.io。
#               整段引入会让「任何用 Stripe 收款的国内站点」的支付请求
#               被拖去 AI 出口。故改为人工提取有用的辅助域名，
#               放进本配置的 ai-openai / ai-copilot 内联集。
#
# 【参考未采用】
#   qianchongyang/openclash-ai-rules
#     单文件 AI.list，Claude 覆盖较细（含 anthropic.auth0.com、
#     statsig.anthropic.com、IP-CIDR 160.79.104.0/21）。已借鉴其
#     Anthropic IP 段。仓库仅 1 star、无更新保障，不作为 provider。
#
# 【明确排除】
#   jinxinkai/clash-ai-rules
#     OpenAI.yaml 内含 DOMAIN-SUFFIX,microsoft.com / gstatic.com /
#     live.com / sfx.ms / recaptcha.net / gvt1-3.com。
#     这些是全互联网级域名，一旦挂在 AI 组，等于把所有微软服务和
#     Google 静态资源都推给 AI 出口节点。属于严重误配，不予采用。
#
# 【外部依赖】
#   AI 增强与游戏平台增强完全基于 inline provider，不新增外部规则源，
#   断网/源站故障时这两块分流仍可正常工作。
#   远程 provider 共 7 个（ads / ai / youtube / crypto / disney / apple /
#   google），全部走 jsdelivr，且显式 proxy: DIRECT。
#   网络不畅时内核启动会变慢。
# ============================================================


# ============================================================
# 附：mitce 机场配置的核验结论
# ------------------------------------------------------------
# 参照对象：mitce 机场下发的完整配置（含真实节点凭据）。
# 只吸收结构性做法，不复制其 proxies / external-controller / 订阅地址。
#
# 【已吸收】
#   1. profile.store-selected / store-fake-ip
#   2. dns.respect-rules + direct-nameserver + direct-nameserver-follow-policy
#   3. rule-providers 显式 proxy: DIRECT
#   4. ntp 时间同步
#   5. tun.endpoint-independent-nat
#   6. load-balance 组（strategy: consistent-hashing）
#   7. fake-ip-filter 补 '*.arpa'
#   8. url-test 组加 expected-status: 204（mitce 未做，属本次额外加固）
#   9. geo-auto-update（mitce 未做，属本次额外加固）
#
# 【核验后未采用】
#   format: mrs
#     官方限制：mrs 的 behavior 只能是 domain / ipcidr。
#     本配置的 7 个远程 provider 都是 behavior: classical（Perfect-Rules
#     只提供 yaml），无法转 mrs，除非换规则源。
#
#   fallback + fallback-filter
#     mitce 用的是老一代「国内/国外双 DNS 分流」方案：
#     靠 fallback-filter 的 geoip/domain 名单猜哪些结果被污染。
#     现在官方给了 direct-nameserver，是按「这条域名实际走哪个出口」
#     动态选解析器，比猜名单准。两者同时开会让解析路径互相打架，
#     所以只保留 direct-nameserver 一条路。
#     另注：fallback-filter.geosite 官方已标注「该字段已废弃」。
#
#   global-client-fingerprint: chrome
#     官方已弃用，文档明确写着「请直接在 proxy 内设置
#     client-fingerprint」。写了不报错但不生效，属于噪音，故不加。
#
#   dns.use-hosts: false / use-system-hosts: false
#     两者默认都是 true。关掉会忽略系统 hosts 文件，
#     对习惯用 hosts 做本地映射/屏蔽的人是反向优化，故保持默认。
#
#   tun.stack: system
#     官方建议值其实是 mixed（TCP 系统栈 + UDP gvisor 栈）。
#     mitce 用 system 也能跑，但 mixed 兼容性更好，故保持 mixed。
#
#   dns.listen: ':53'
#     监听全网卡 53 端口，在 Windows 上容易和其他 DNS 服务抢端口。
#     本配置保留 127.0.0.1:1053；TUN 的 dns-hijack 会把 any:53 直接
#     导入内部 DNS 模块，不依赖这个 listen。
#
#   AND,((DST-PORT,443),(NETWORK,UDP)),REJECT
#     全局封 QUIC。有效但过于激进，会连国内直连站点的 HTTP/3 一起封。
#     已作为可选规则写进 rules 第 0 节（默认注释掉）。
#
#   tun.mtu: 1500
#     官方文档：MTU「一般用户默认即可」。无明确收益，不改。
#
# 【mitce 有而本配置不需要的】
#   Bahamut / GoogleFCM / Speedtest / 负载均衡地区细分（HK/JP/…）
#     Bahamut 是中国台湾地区动画疯，GoogleFCM 是 Android 推送；
#     本配置面向 Windows 桌面，用不上。
#   纯 IP 规则集（China-IP / Apple-IP / Netflix-IP …）
#     本配置用 GEOIP,CN + GEOIP,private 覆盖，功能等价且条目更少。
#   无广告拦截、无进程识别
#     这两块是本配置的增量优势，不反向对齐。
# ============================================================
