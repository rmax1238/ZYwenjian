# ---------------- 策略组 ----------------

proxy-groups:

  # ==========================================================
  # 分组顺序
  #    1  🎯 节点选择        唯一总控。所有分流组第一项都指向它，
  #                          在这里选一次，全局跟着走。
  #    2  📋 节点手动选择    全部节点平铺，手动挑一个。
  #    3  ♻️ 节点自动选择    全部节点自动测速，取最快。
  #    4  ⚖️ 节点负载均衡    全部节点按目标域名分流，抗单点限速。
  #    5~9   AI 组 ×5         AI服务 / ChatGPT / Claude / Gemini / Copilot
  #   10~17  分流组 ×8        油管 / 流媒体 / 电报 / 微软 / 苹果 / 谷歌 / 币圈 / 游戏
  #   18~24  地区组 ×7        中国香港 / 日本 / 新加坡 / 美国 / 中国台湾 / 韩国 / 其他地区
  #   25     🛑 广告拦截
  #   26     🚀 兜底代理        纯 MATCH 兜底，内容仅 [节点选择, DIRECT]。
  #
  # 【统一候选列表】
  # 所有分流组的候选列表完全一致（AI 组除外，见下）：
  #     节点选择 → 节点手动选择 → 节点自动选择 → 节点负载均衡
  #     → 中国香港/日本/新加坡/美国/中国台湾/韩国 → 其他地区 → DIRECT
  # 共 11 项。想增删任何一项，必须 22 个组一起改，否则破坏一致性。
  #
  # 【AI 组唯一例外】
  # 🤖 AI服务 / 🧠 ChatGPT / 🎭 Claude / ✨ Gemini / 🧩 Copilot 五个组
  # 不含中国香港节点 —— OpenAI、Anthropic、Google 均未把中国香港列入
  # 支持地区，选中国香港会直接得到 not available in your region。
  # 除中国香港一项外，与统一列表完全相同（10 项）。
  # ==========================================================

  # ==========================================================
  # 节点四件套
  #
  #   🎯 节点选择      总入口。在这里选一次，所有分流组跟着走。
  #   📋 节点手动选择  全部节点平铺，手动挑一个。
  #   ♻️ 节点自动选择  全部节点自动测速，取最快。
  #   ⚖️ 节点负载均衡  全部节点按目标域名分摊，抗单点限速。
  #
  # 四者职责不重叠：总入口只转发，手动选择只列节点，
  # 自动选择只测速，负载均衡只做分摊。
  #
  # 自动选择 vs 负载均衡 怎么选：
  #   自动选择 = 所有连接都挤在最快那一个节点上，延迟最低，
  #              但单节点带宽会被自己吃满，下载大文件时明显。
  #   负载均衡 = 不同目标域名分到不同节点，总带宽是叠加的，
  #              适合 Steam 下载 / 多线程下载 / 多人同时用。
  #              代价是每个站点固定走某一个节点，可能不如「最快那个」快。
  #
  # 注意：节点选择不引用「兜底代理」，否则 兜底代理 → 节点选择
  #       → 兜底代理 会成环，mihomo 的 DAG 检查会拒绝加载。
  # ==========================================================
  - name: "🎯 节点选择"
    type: select
    proxies:
      - "📋 节点手动选择"
      - "♻️ 节点自动选择"
      - "⚖️ 节点负载均衡"
      - "🇭🇰 中国香港节点"
      - "🇯🇵 日本节点"
      - "🇸🇬 新加坡节点"
      - "🇺🇸 美国节点"
      - "🇨🇳 中国台湾节点"
      - "🇰🇷 韩国节点"
      - "🌍 其他地区"
      - "DIRECT"

  - name: "📋 节点手动选择"
    type: select
    include-all-proxies: true
    exclude-type: "Direct"
    exclude-filter: "(?i)官网|流量|剩余|到期|过期|套餐|订阅|重置|邀请|客服|返利|购买|续费|试用|测速|群组|机场|traffic|expire|expired|subscription|reset|official|website"

  - name: "♻️ 节点自动选择"
    type: url-test
    include-all-proxies: true
    exclude-type: "Direct"
    exclude-filter: "(?i)官网|流量|剩余|到期|过期|套餐|订阅|重置|邀请|客服|返利|购买|续费|试用|测速|群组|机场|traffic|expire|expired|subscription|reset|official|website"
    url: "https://cp.cloudflare.com/generate_204"
    interval: 300
    expected-status: 204
    tolerance: 50
    lazy: true

  - name: "⚖️ 节点负载均衡"
    type: load-balance
    strategy: consistent-hashing
    include-all-proxies: true
    exclude-type: "Direct"
    exclude-filter: "(?i)官网|流量|剩余|到期|过期|套餐|订阅|重置|邀请|客服|返利|购买|续费|试用|测速|群组|机场|traffic|expire|expired|subscription|reset|official|website"
    url: "https://cp.cloudflare.com/generate_204"
    interval: 300
    expected-status: 204
    lazy: true
    # strategy: consistent-hashing = 同一个「目标地址」固定分到同一个节点。
    #
    # 为什么不用 round-robin（轮询）：轮询会让同一个网站的不同请求走不同
    # 出口 IP，登录态、风控、支付类站点会直接判定异常，属于能用但会出事。
    #
    # 为什么不用 sticky-sessions：那是按「来源 + 目标」缓存 10 分钟，
    # 对「本机单一出口」这个场景收益不大，一致性哈希已经覆盖。
    #
    # 目标地址是域名时按顶级域名匹配，所以 a.example.com 和
    # b.example.com 会落在同一节点，不会把一个站点拆散到多个出口。
    #
    # 不想要这个组：删掉本段，再把其余 22 个组里的
    #   - "⚖️ 节点负载均衡"
    # 那一行一并删掉即可。

  - name: "🤖 AI服务"
    type: select
    proxies:
      - "🎯 节点选择"
      - "📋 节点手动选择"
      - "♻️ 节点自动选择"
