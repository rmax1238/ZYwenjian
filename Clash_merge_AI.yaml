  # 游戏客户端进程识别。
  # 【为什么必须有】Steam / 战网 / Riot 的游戏本体连接大量走裸 IP 或
  # 自建服务器（P2P、UDP、非标准端口），域名规则根本抓不到，只有按进程
  # 匹配才能把这些流量拉进游戏组。依赖 find-process-mode: strict。
  # 【顺序约束】进程规则一命中就终止匹配，所以上面 game-cn 里的国内下载
  # CDN 域名规则必须排在进程规则之前，否则 Steam 下载会被一并拖去代理。
  # 【没有收录国服游戏进程】WeGame / 米哈游国服等由 game-cn 的域名规则
  # 负责直连，若在这里加进程规则反而会把它们推去代理。
  games:
    type: inline
    behavior: classical
    payload:
      - "PROCESS-NAME-WILDCARD,*Steam*"
      - "PROCESS-NAME-WILDCARD,*EpicGames*"
      - "PROCESS-NAME-WILDCARD,*EpicWebHelper*"
      - "PROCESS-NAME-WILDCARD,*Battle.net*"
      - "PROCESS-NAME-WILDCARD,*RiotClient*"
      - "PROCESS-NAME-WILDCARD,*LeagueClient*"
      - "PROCESS-NAME-WILDCARD,*VALORANT*"
      - "PROCESS-NAME-WILDCARD,*Ubisoft*"
      - "PROCESS-NAME-WILDCARD,*upc.exe*"
      - "PROCESS-NAME-WILDCARD,*EADesktop*"
      - "PROCESS-NAME-WILDCARD,*EABackgroundService*"
      - "PROCESS-NAME-WILDCARD,*Origin.exe*"
      - "PROCESS-NAME-WILDCARD,*GalaxyClient*"
      - "PROCESS-NAME-WILDCARD,*Rockstar*"
      - "PROCESS-NAME-WILDCARD,*SocialClub*"
      - "PROCESS-NAME-WILDCARD,*Discord*"


