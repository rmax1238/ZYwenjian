# ============================================================================
# 肉視頻 rou.video · QuantumultX 重写配置 v1.0.0 (2026-09-18)
# ============================================================================
# 效果：QX 开启时，任何播放器直接播 https://rou.video/api/hls/<视频id>
#       不再依赖 Scripting 肉視頻脚本的本地代理（127.0.0.1:8791）进程存活。
#
# ── 一、安装步骤 ──────────────────────────────────────────────────────
# 1. QX → 主界面「重写」→ 右上角 ➕ → 「脚本」→ 名字填 rou-unpack.js
#    → 粘贴 rou-unpack.js 全文 → 保存。
# 2. 「重写」页 → 编辑 [rewrite_local] → 添加第三节那行规则
#    （类型 script-response-body，脚本选 rou-unpack.js）。
# 3. 设置 → MITM → 主机名：在你现有 hostname 行尾部追加第五节清单。
#    若从未装过 MITM 证书：MITM 页 → 生成证书 → 安装描述文件 →
#    iOS 设置 → 通用 → VPN与设备管理 安装 → 通用 → 关于本机 →
#    证书信任设置 → 对 QuantumultX 根证书打开完全信任。
# 4. 确认 QX 总开关与「重写」开关都开。
#
# ── 二、播放地址 ──────────────────────────────────────────────────────
#   https://rou.video/api/hls/<视频id>
#   视频 id = rou.video/v/<id> 页面 URL 末段（肉視頻脚本详情页
#   「用浏览器打开」可达该页）。例：
#   https://rou.video/api/hls/cmtomyyc9018hmu1oo53ab5dk
#   播放器请求它会 302 到伪装 PNG（index.png），QX 拦截解包即标准 HLS。
#
# ── 三、[rewrite_local] 规则 ─────────────────────────────────────────
[rewrite_local]
^https?:\/\/[^\/]*(?:gokj68|monb18|devn81|hihl36|lacz71)\.xyz\/hls\/[^?#]+\.png url script-response-body rou-unpack.js

# ── 四、[mitm] 追加项 ────────────────────────────────────────────────
# 追加到你现有 hostname 行的尾部（逗号分隔，不是替换整行）：
#   gokj68.xyz, *.gokj68.xyz, monb18.xyz, *.monb18.xyz, devn81.xyz, *.devn81.xyz, hihl36.xyz, *.hihl36.xyz, lacz71.xyz, *.lacz71.xyz
# 注意：
# · 裸域与通配都要写 —— 实测清单（index.png）会落在裸域（如 gokj68.xyz），
#   分段落在 v1–v5 子域（如 v3.monb18.xyz），*.域名 不覆盖裸域。
# · CDN 换主域时（URL 仍是 /hls/…/xxx.png 形态）：改两处 —— 规则正则里的
#   主域备选组 + 本清单，其他都不用动。
# · 规则正则已按主域白名单收口，不会拦截其它网站的 /hls/*.png。
#
# ── 五、验证与排错（重要，先读再装）─────────────────────────────────
# ▸ 本方案的唯一成败未知数是 QX 对「二进制响应体」的字符串保真度：
#   脚本读侧用 PNG 魔数 0x89 0x50 自检，回写侧靠真机播放验证。
# ▸ 正常：播放器直接播第二节地址，全程无感知。
# ▸ 弹出通知「响应体二进制保真检验失败」：当前 QX 版本的
#   script-response-body 把响应体按文本交出（读侧不保真），本方案在该
#   版本不可用 → 删除本重写即可，脚本已自动放行，不影响原播放路径。
# ▸ 能列出清晰度/时长（清单已解出）但画面不出：TS 回写侧不保真
#   （UTF-8 回写导致长度膨胀），同样不可用，删除重写即可。
# ▸ 两种症状都没出现但播放器报错：把播放 URL 与报错发回排查
#   （新 CDN 主域 / URL 形态变化）。
#
# ── 六、已知边界 ──────────────────────────────────────────────────────
# · 仅本机生效（MITM 是设备级），别人不能播你复制的地址；URL 带时效签名。
# · 伪装 PNG 流量都过一遍 JS：清单解压 9 KB 毫秒级；TS 分段只做字节重建
#   不做解压，百 KB 级也是毫秒级，中端机型无感。
# · 与 Scripting 肉視頻脚本的本地代理互不冲突：复制按钮给的
#   127.0.0.1:8791 地址走本地代理（需脚本进程存活）；第二节地址走 QX
#   （需 QX 开启）。两条路并存，按你用的地址分流。
# · 播放器若坚持校验 Content-Type（伪装 PNG 响应头是 image/png），
#   大多数播放器按内容嗅探不受影响；个别不认时可再加一条
#   script-response-header 规则把清单的 Content-Type 改为
#   application/vnd.apple.mpegurl（遇到再说）。
