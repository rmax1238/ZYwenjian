# ============================================================
# Clash 分流配置 · 快速维护指南
# 内核：mihomo（Clash Verge Rev / Clash Meta / Mihomo Party）
#
# 【添加一条自定义分流：只改一个位置】
# 1. 在下方“自定义分流入口”复制一条模板，替换域名和目标。
# 2. 删除该行前面的注释符号 #，保存整个 YAML。
# 3. 先确认规则目标名称与现有策略组完全一致；不要为加一条规则改组、DNS、TUN 或 provider。
#
# 选择匹配方式：DOMAIN=单个主机；DOMAIN-SUFFIX=主域及全部子域；
# DOMAIN-KEYWORD=域名包含关键词。优先用 DOMAIN 或 DOMAIN-SUFFIX，范围更明确。
# 常用目标：DIRECT（直连）、REJECT（拦截）、🎬 流媒体、🔍 谷歌服务、📺 油管专用等现有组。
# 规则自上而下匹配，第一条命中即停止。本文件的自定义入口靠前，适合覆盖后续通用规则；
# 只添加必要的窄域名，避免把整个共享平台（如 githubusercontent.com）改道。
#
# 维护同步：若同时使用 FlClash，改完后运行“生成FlClash覆写脚本.py”；
# 若同时使用 v2rayN，还需把规则按其格式手动映射到“v2rayN分流.json”。
# 使用 Clash Verge Rev 全局扩展覆写时，应应用完整文件，不能只粘贴新增规则行。
# ============================================================


# ---------------- 基础网络 ----------------

mode: rule
log-level: warning
ipv6: false

find-process-mode: strict            # 游戏平台分流依赖进程识别
unified-delay: true
tcp-concurrent: true


# ---------------- 状态持久化 ----------------
# store-selected：把「在哪个组选了哪个节点」写进 cache.db。
#   不开的话，每次切订阅 / 重启内核，分组选择可能回到第一项，
#   需要重新点一遍。
# store-fake-ip：把 fake-ip 映射表也持久化。
#   不开的话重启后域名会拿到新的 fake-ip，某些长连接应用会连不上。

profile:
  store-selected: true
  store-fake-ip: true


# ---------------- 时间同步 ----------------
# 【为什么要开】url-test 的延迟数值、TLS 证书校验都依赖系统时钟。
# 系统时间偏差过大时会出现「节点全部超时」或握手失败。
# write-to-system 保持 false：同步到系统时间需要管理员权限，
# 交给系统自己的时间服务更省事。

ntp:
  enable: true
  write-to-system: false
  server: ntp.aliyun.com
  port: 123
  interval: 30


# ---------------- GEO 数据自动更新 ----------------
# 本配置大量依赖 GEOSITE（category-games / openai / anthropic /
# google-gemini / netflix / spotify / tiktok …）。
# 数据陈旧会导致新域名漏匹配，这里让内核自己按天更新。
# 若你的客户端已经自带 geo 更新（Clash Verge 有此选项），
# 删掉下面两行即可，避免重复下载。

geo-auto-update: true
geo-update-interval: 24


# ---------------- TUN ----------------
# stack: mixed = TCP 走系统栈、UDP 走 gvisor 栈。这是官方建议值：
#   TCP 用系统栈性能最好，UDP 用 gvisor 兼容性最好。

tun:
  enable: true
  stack: mixed
  auto-route: true
  auto-detect-interface: true
  strict-route: true
  dns-hijack:
    - any:53
    - tcp://any:53
  # endpoint-independent-nat：让 TUN 的 UDP NAT 变成「端点无关」。
  #   效果是游戏 / P2P 的 UDP 打洞更容易成功（NAT 类型更好）。
  #   代价：官方说明「性能可能会略有下降」，不玩游戏可以关掉。
  endpoint-independent-nat: true


# ---------------- 域名嗅探 ----------------
# 【AI 分流关键项】
# 桌面端 ChatGPT / Claude / Gemini 客户端以及各类 AI CLI（Claude Code、
# Codex CLI、Cursor）常自带 DoH 或直接用 IP 连接，此时 mihomo 只能看到
# IP，域名规则全部失效，AI 流量会掉到 MATCH 走兜底代理。
# 开启嗅探后可按 TLS SNI / HTTP Host 还原域名，域名规则才能命中。
# parse-pure-ip: true 是让「纯 IP 连接」也参与嗅探的关键开关。

sniffer:
  enable: true
  override-destination: false
  force-dns-mapping: true
  parse-pure-ip: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
  skip-domain:
    - "Mijia Cloud"
    - "+.push.apple.com"
    - "+.wechat.com"
    - "+.qq.com"


# ---------------- DNS ----------------

dns:
  enable: true
  listen: 127.0.0.1:1053
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16

  # prefer-h3 保持 false：官方明确「强烈不建议和 respect-rules 一起使用」，
  # 这里显式写出来当护栏，免得别处被改成 true。
  prefer-h3: false

  # respect-rules：让 DNS 上游连接也遵守路由规则。
  #   配合下面的 proxy-server-nameserver 使用（缺了它会出现
  #   「要解析 DoH 域名，但解析器本身要走代理」的鸡蛋问题）。
  respect-rules: true

  fake-ip-filter-mode: blacklist
  fake-ip-filter:
    - '*.lan'
    - '*.local'
    - '*.arpa'
    - '*.home.arpa'
    - 'localhost.ptlogin2.qq.com'
    - '+.msftconnecttest.com'
    - '+.msftncsi.com'
    - 'time.*.com'
    - 'ntp.*.com'
    - 'ntp.aliyun.com'
    - '+.pool.ntp.org'
    - '+.stun.*.*'
    - 'xbox.*.microsoft.com'
    - '*.xboxlive.com'
    - '+.srv.nintendo.net'
    - '*.stun.playstation.net'
    - '*.battlenet.com.cn'
    - '+.market.xiaomi.com'
    - '+.work.weixin.qq.com'
    # 上面这些必须拿到真实 IP：NTP / STUN / 主机联机 / Windows 连通性检测
    # 都不走域名规则，拿到 fake-ip 就会直接连不上。

  nameserver:
    - https://doh.pub/dns-query
    - https://dns.alidns.com/dns-query

  default-nameserver:
    - 223.5.5.5
    - 223.6.6.6
    # 必须填 IP（不能填 DoH 域名），否则解析器自己的域名没人解析。

  proxy-server-nameserver:
    - https://doh.pub/dns-query
    - https://dns.alidns.com/dns-query
    # 只用于解析节点服务器域名。走国内 DoH 是因为节点域名基本都在
    # 国内可解析范围，且此时代理还没建立，不能依赖代理。

  # direct-nameserver：给「直连出口」的域名单独指定解析器。
  # 【为什么需要】以前靠 nameserver-policy 手工枚举哪些域名走国内 DNS，
  # 漏一个就会用默认解析器解析直连域名，拿到被污染的 IP，然后
  # GEOIP,CN 判成境外，直连流量被错误地推进代理。
  # 有了它，解析器自动跟着「这条域名最终走 DIRECT」的判定走，无需枚举。
  direct-nameserver:
    - https://doh.pub/dns-query
    - https://dns.alidns.com/dns-query
    - 119.29.29.29
  direct-nameserver-follow-policy: true
  # follow-policy: true 表示 direct-nameserver 仍然尊重 nameserver-policy
  # （policy 命中时以 policy 为准），两者取并集，不冲突。

  nameserver-policy:
    'geosite:cn,private':
      - https://doh.pub/dns-query
      - https://dns.alidns.com/dns-query


# ---------------- 规则集 ----------------
# 【手动维护：规则集】每个 provider 是一组匹配条件，不决定最终出口；
# 真正的去向由下方 rules 中的 RULE-SET,<provider名>,<策略组或DIRECT> 指定。
# inline 的 payload 可直接增删一行匹配条件；http 的远程内容会更新，
# 不要编辑远程缓存：新增单条域名优先写进文件末尾的 rules 自定义规则区。
# 删除 provider 前，先删除 rules 中所有引用它的 RULE-SET 行；
# 删除规则行后若 provider 无其他引用，也可删除 provider 以免无用下载。

rule-providers:

  # ---- 远程 provider 共 6 个（Perfect-Rules，每日自动更新）----
  #
  # 全部显式声明 proxy: DIRECT，理由有两个：
  #   1) 规则集下载不吃订阅流量（一天一次，但 Steam/游戏类规则集不小）；
  #   2) 上面开了 dns.respect-rules，若不声明，内核内部的 HTTP 请求
  #      也会按路由规则走 —— 这些域名没有专门规则，会掉进
  #      MATCH → 🚀 兜底代理，形成「没规则就没法下载规则」的依赖。
  # 如果你的网络直连 jsdelivr 不通，把 proxy: DIRECT 改成
  # proxy: "🎯 节点选择" 即可。

  ads:
    type: http
    behavior: classical
    format: yaml
    interval: 86400
    proxy: DIRECT
    url: "https://cdn.jsdelivr.net/gh/n0de-sudo/Perfect-Rules@main/Clash/rules/ads.yaml"

  ai:
    type: http
    behavior: classical
    format: yaml
    interval: 86400
    proxy: DIRECT
    url: "https://cdn.jsdelivr.net/gh/n0de-sudo/Perfect-Rules@main/Clash/rules/ai.yaml"
    # 内容 = GEOSITE,category-ai-!cn（meta-rules-dat，约 180 条，AI 总兜底）

  youtube:
    type: http
    behavior: classical
    format: yaml
    interval: 86400
    proxy: DIRECT
    url: "https://cdn.jsdelivr.net/gh/n0de-sudo/Perfect-Rules@main/Clash/rules/youtube.yaml"

  disney:
    type: http
    behavior: classical
    format: yaml
    interval: 86400
    proxy: DIRECT
    url: "https://cdn.jsdelivr.net/gh/n0de-sudo/Perfect-Rules@main/Clash/rules/disney.yaml"

  apple:
    type: http
    behavior: classical
    format: yaml
    interval: 86400
    proxy: DIRECT
    url: "https://cdn.jsdelivr.net/gh/n0de-sudo/Perfect-Rules@main/Clash/rules/apple.yaml"

  google:
    type: http
    behavior: classical
    format: yaml
    interval: 86400
    proxy: DIRECT
    url: "https://cdn.jsdelivr.net/gh/n0de-sudo/Perfect-Rules@main/Clash/rules/google.yaml"

  # ---- 游戏平台专项（inline，随配置走，无外部依赖）----

  # 国服游戏平台 + Steam 国内下载 CDN。
  # 这些必须排在游戏代理规则之前直连，原因有两个：
  #   1) 国服平台走代理会被判定异地登录，延迟也暴涨；
  #   2) Steam 国内 CDN 直连通常比机场节点快得多，而且不吃订阅流量。
  game-cn:
    type: inline
    behavior: classical
    payload:
      # 国服游戏平台
      - "DOMAIN-SUFFIX,wegame.com"
      - "DOMAIN-SUFFIX,wegame.com.cn"
      - "DOMAIN-SUFFIX,wegameplus.com"
      - "DOMAIN-SUFFIX,tencent-gcloud.com"
      - "DOMAIN-SUFFIX,tencentstart.com"
      - "DOMAIN-SUFFIX,roblox.qq.com"
      - "DOMAIN-SUFFIX,roco.qq.com"
      - "DOMAIN-SUFFIX,gouhuo.qq.com"
      - "DOMAIN-SUFFIX,qq163.net"
      - "DOMAIN-SUFFIX,webgame163.com"
      - "DOMAIN-SUFFIX,bilibiligame.net"
      - "DOMAIN-SUFFIX,bilibiligame.cn"
      - "DOMAIN-SUFFIX,mihoyo.com"
      - "DOMAIN-SUFFIX,mihoyomall.com"
      - "DOMAIN-SUFFIX,mihoyogift.com"
      - "DOMAIN-SUFFIX,mihoyocg.com"
      - "DOMAIN-SUFFIX,wanmei.com"
      - "DOMAIN-SUFFIX,wmsj.cn"
      - "DOMAIN-SUFFIX,sdo.com"
      - "DOMAIN-SUFFIX,yostar.cn"
      - "DOMAIN-SUFFIX,leagueoflegends.cn"
      - "DOMAIN-SUFFIX,lpl.com.cn"
      - "DOMAIN-SUFFIX,bluearchive-cn.com"
      - "DOMAIN-SUFFIX,gog.qtlglb.com"
      # Steam 国内下载 CDN
      # 只想要「商店代理、下载直连」就保留这段；
      # 想连下载也走代理，把 steamcontent.com 及下面各 CDN 行删掉即可。
      - "DOMAIN-SUFFIX,steamcontent.com"
      - "DOMAIN-SUFFIX,dl.steam.clngaa.com"
      - "DOMAIN-SUFFIX,st.dl.bscstorage.net"
      - "DOMAIN-SUFFIX,st.dl.eccdnx.com"
