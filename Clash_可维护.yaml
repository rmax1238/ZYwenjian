    exclude-filter: "(?i)官网|流量|剩余|到期|过期|套餐|订阅|重置|邀请|客服|返利|购买|续费|试用|测速|群组|机场|traffic|expire|expired|subscription|reset|official|website"
    exclude-type: "Direct"
    url: "https://cp.cloudflare.com/generate_204"
    interval: 300
    expected-status: 204
    tolerance: 50
    lazy: true

  - name: "🇹🇼 中国台湾节点"
    type: url-test
    include-all-proxies: true
    filter: '(?i)🇹🇼|中国台湾|台湾|\bTW\b|\bTWN\b|Taiwan|Taipei'
    exclude-filter: "(?i)官网|流量|剩余|到期|过期|套餐|订阅|重置|邀请|客服|返利|购买|续费|试用|测速|群组|机场|traffic|expire|expired|subscription|reset|official|website"
    exclude-type: "Direct"
    url: "https://cp.cloudflare.com/generate_204"
    interval: 300
    expected-status: 204
    tolerance: 50
    lazy: true

  - name: "🇰🇷 韩国节点"
    type: url-test
    include-all-proxies: true
    filter: '(?i)🇰🇷|韩国|\bKR\b|\bKOR\b|Korea|Seoul|首尔'
    exclude-filter: "(?i)官网|流量|剩余|到期|过期|套餐|订阅|重置|邀请|客服|返利|购买|续费|试用|测速|群组|机场|traffic|expire|expired|subscription|reset|official|website"
    exclude-type: "Direct"
    url: "https://cp.cloudflare.com/generate_204"
    interval: 300
    expected-status: 204
    tolerance: 50
    lazy: true

  # ---------- 其他地区 ----------
  #
  # 【重要】使用 (?!) 负向先行断言排除已分地区节点。
  # 依赖 mihomo 的 regexp2 引擎（.NET 风格，支持断言）；
  # 原版 Clash / 使用 Go RE2 的客户端会编译失败。
  - name: "🌍 其他地区"
    type: select
    include-all-proxies: true
    filter: '(?i)^(?!.*(?:🇭🇰|中国香港|香港|\bHK\b|\bHKG\b|Hong[ -]?Kong|🇯🇵|日本|\bJP\b|\bJPN\b|Japan|Tokyo|Osaka|🇸🇬|新加坡|新国|\bSG\b|\bSGP\b|Singapore|🇺🇸|美国|美西|美东|美中|\bUS\b|\bUSA\b|United[ -]?States|America|Los[ -]?Angeles|New[ -]?York|San[ -]?Francisco|🇹🇼|中国台湾|台湾|\bTW\b|\bTWN\b|Taiwan|Taipei|🇰🇷|韩国|\bKR\b|\bKOR\b|Korea|Seoul|首尔)).*'
    exclude-filter: "(?i)官网|流量|剩余|到期|过期|套餐|订阅|重置|邀请|客服|返利|购买|续费|试用|测速|群组|机场|traffic|expire|expired|subscription|reset|official|website"
    exclude-type: "Direct"

  # ---------- 广告拦截 ----------
  - name: "🛑 广告拦截"
    type: select
    proxies:
      - REJECT
      - DIRECT

  - name: "🚀 兜底代理"
    type: select
    proxies:
      - "🎯 节点选择"
      - "♻️ 节点自动选择"
      - "⚖️ 节点负载均衡"
      - "DIRECT"
    # 只调整未命中其他规则的 MATCH 流量；默认仍跟随「🎯 节点选择」。

# ---------------- 规则 ----------------
# 【手动维护：分流规则】从上到下匹配，命中第一条就停止；
# 越具体的规则越靠前：自定义站点规则应放在下方「自定义规则」区，
# 该区位于通用 GEOIP/GEOSITE,CN 和最终 MATCH 之前。
# 维护原则：删除自定义规则时只删 rules 中对应的那一行；引用 RULE-SET 时，确认不再使用后才删 provider。
# 删除策略组前，先移除所有指向该组的规则和组成员引用；勿删除最终 MATCH。
# 游戏进程规则会先命中，国内游戏/CDN直连规则不能放到进程规则之后。
# Clash Verge Rev 全局扩展覆写中 rules 数组会整体替换订阅规则，必须使用完整规则链，不能只粘贴新增行。

rules:

  # 0. 【可选，默认关闭】全局封锁 QUIC（UDP/443）
  #    背景：不少机场对 UDP 443 的转发质量明显差于 TCP，
  #          表现是 YouTube / Google 首屏卡住、视频缓冲。
  #          封掉 QUIC 后浏览器会自动回落到 HTTP/2 over TCP，通常更稳。
  #    代价：所有 HTTP/3 站点失去 QUIC 加速；依赖 UDP 443 的应用受影响；
  #          嗅探里的 QUIC 规则也就不再起作用。
  #    需要时把下面这行的注释去掉，位置保持在最前。
  # - "AND,((DST-PORT,443),(NETWORK,UDP)),REJECT"

  # 1. 私有地址 / 局域网
  - "GEOSITE,private,DIRECT"
  - "GEOIP,private,DIRECT,no-resolve"
  - "IP-CIDR,127.0.0.0/8,DIRECT,no-resolve"
  - "IP-CIDR,224.0.0.0/4,DIRECT,no-resolve"
  - "IP-CIDR,255.255.255.255/32,DIRECT,no-resolve"

  # ============== 自定义分流入口：只在这里添加规则 ==============
  # 将 example.com 换成实际域名，将目标换成现有组名或 DIRECT/REJECT。
  # 复制模板后删除行首的 # 才会生效；每条规则单独一行。
  # 精确匹配单个主机：
  # - "DOMAIN,api.example.com,🎬 流媒体"
  # 匹配主域及所有子域（常用）：
  # - "DOMAIN-SUFFIX,example.com,🎬 流媒体"
  # 直连某个域名：
  # - "DOMAIN-SUFFIX,example.cn,DIRECT"
  # 拦截某个域名：
  # - "DOMAIN-SUFFIX,ads.example.com,REJECT"
  #
  # 目标组可用上方 proxy-groups 中已有的 name；不要凭空写新组名。
  # 本区域位于规则靠前位置，命中后会覆盖后续广告、AI、游戏、服务及大陆规则。
  # 若规则只应影响某个分类，请使用具体主机/域名，避免宽泛后缀误伤。
  # ===============================================================

  # SideStore：存活检查与 GitHub Release 资源走代理
  - "DOMAIN-SUFFIX,alive.github.com,🔍 谷歌服务"
  - "DOMAIN-SUFFIX,release-assets.githubusercontent.com,🔍 谷歌服务"

  # 2. 广告
  - "RULE-SET,ads,🛑 广告拦截"

  # 3. 国内 AI 直连（必须在 AI 规则之前）
  - "RULE-SET,ai-cn,DIRECT"

  # 4. 游戏平台
  #    顺序是刻意设计的：国服平台与 Steam 国内 CDN 先直连（快、省流量），
  #    再走客户端进程识别（抓游戏内没有域名的连接），最后域名集兜底。
  - "RULE-SET,game-cn,DIRECT"
  - "RULE-SET,games,🎮 游戏平台"
  - "GEOSITE,category-games,🎮 游戏平台"
  - "GEOSITE,discord,🎮 游戏平台"

  # 5. 国区服务直连（必须放在对应服务组之前）
  - "GEOSITE,apple-cn,DIRECT"
  - "GEOSITE,microsoft@cn,DIRECT"
  - "DOMAIN-SUFFIX,windowsupdate.com,DIRECT"
  - "DOMAIN-SUFFIX,download.windowsupdate.com,DIRECT"
  - "DOMAIN-SUFFIX,delivery.mp.microsoft.com,DIRECT"
  - "DOMAIN-SUFFIX,update.microsoft.com,DIRECT"

  # 6. AI 分流
  #    顺序：先各服务的辅助链路，再按服务拆组，最后用 AI 总集兜底。
  - "RULE-SET,ai-openai,🧠 ChatGPT"
  - "GEOSITE,openai,🧠 ChatGPT"
  - "GEOSITE,anthropic,🎭 Claude"
  - "GEOSITE,google-gemini,✨ Gemini"
  - "GEOSITE,google-deepmind,✨ Gemini"
  - "RULE-SET,ai-copilot,🧩 Copilot"
  - "RULE-SET,ai-extra,🤖 AI服务"
  - "RULE-SET,ai,🤖 AI服务"
  # Anthropic 自有 IP 段，防止域名未命中时漏走
  - "IP-CIDR,160.79.104.0/21,🎭 Claude,no-resolve"

  # 7. YouTube
  - "RULE-SET,youtube,📺 油管专用"

  # 8. 流媒体
  - "RULE-SET,disney,🎬 流媒体"
  - "GEOSITE,netflix,🎬 流媒体"
  - "GEOSITE,spotify,🎬 流媒体"
  - "GEOSITE,tiktok,🎬 流媒体"

  # 9. Apple
  - "RULE-SET,apple,🍎 苹果服务"

  # 10. Google
  - "RULE-SET,google,🔍 谷歌服务"

  # 11. Telegram
  - "GEOSITE,telegram,💬 电报专用"

  # 12. Microsoft
  - "GEOSITE,microsoft,Ⓜ️ 微软服务"

  # 13. 自定义规则（按需添加/删除，示例默认关闭）
  # 将新规则写在本区下方，行首两个空格 + 连字符 + 引号，与现有规则对齐。
  
  # 下列示例只用于演示语法，example.com 不是实际需要代理的网站：
  # - "DOMAIN,api.example.com,🎬 流媒体"        # 仅 api.example.com
  # - "DOMAIN-SUFFIX,example.com,🎬 流媒体"      # example.com 和所有子域
  # - "DOMAIN-SUFFIX,example.cn,DIRECT"         # 直连该域名
  # - "RULE-SET,ai-extra,🤖 AI服务"              # 引用已有 provider；勿重复加
  # 如需覆盖前面已有的分类规则（如 AI、游戏、广告），把新规则移到
  # 需要覆盖的规则之前；放在本区只能覆盖后面的大陆规则和 MATCH。
  # 删除时只删自己加的行；整组删除请同步清理策略组及 provider 引用。

  # 14. 中国大陆
  - "GEOSITE,CN,DIRECT"
  - "GEOIP,CN,DIRECT,no-resolve"

  # 15. 兜底（始终保持最后一条）
  - "MATCH,🚀 兜底代理"
